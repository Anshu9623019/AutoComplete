# Autocomplete config
autocomplete:
  trie:
    top-k: 5                                 # ← add this for TrieConfig @Value
  llm:
    cache-ttl-minutes: 60  # cache LLM results for 1 hour
    min-trie-results: 2
  semantic:
    min-similarity: 0.75    # only return results above this cosine similarity
    max-results: 5
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.project.auto_complete_service: DEBUG  # ← added so your own logs show up

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always


