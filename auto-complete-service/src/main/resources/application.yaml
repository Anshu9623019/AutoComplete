server:
  port: 8081

spring:
  application:
    name: autocomplete-service

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
      connect-timeout: 10000ms
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: autocomplete-kafka-ak9623019-b363.g.aivencloud.com:19348
    properties:
      security.protocol: SSL
      ssl.truststore.location: /app/client.truststore.jks
      ssl.truststore.password: ${KAFKA_SSL_PASSWORD}
      ssl.keystore.location: /app/client.keystore.jks
      ssl.keystore.password: ${KAFKA_SSL_PASSWORD}
      ssl.key.password: ${KAFKA_SSL_PASSWORD}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
    consumer:
      group-id: frequency-aggregator-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
    listener:
      ack-mode: MANUAL_IMMEDIATE
      auto-startup: true

  task:
    scheduling:
      pool:
        size: 5

autocomplete:
  trie:
    top-k: 5
  llm:
    cache-ttl-minutes: 60
    min-trie-results: 2
  semantic:
    min-similarity: 0.75
    max-results: 5
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.project.auto_complete_service: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

llm:
  groq:
    api-key: ${GROQ_API_KEY}
    base-url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    max-tokens: 100
    enabled: true

embedding:
  provider: cohere
  cohere:
    api-key: ${COHERE_API_KEY}
    base-url: https://api.cohere.ai/v1
    model: embed-english-light-v3.0
    enabled: true